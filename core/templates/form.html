<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ accion }} registro</title>
</head>
<body>

    <h1>{{ accion }} registro</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label for="semestre">Semestre:</label>
            <input
                type="number"
                id="semestre"
                name="semestre"
                value="{{ registro.semestre|default:'' }}"
                required
            >
        </p>

        <p>
            <label for="horas_disponibles">Horas disponibles:</label>
            <input
                type="number"
                id="horas_disponibles"
                name="horas_disponibles"
                value="{{ registro.horas_disponibles|default:'' }}"
                required
            >
        </p>

        <button type="submit">
            {{ accion }}
        </button>

        <a href="{% url 'lista' %}">Cancelar</a>
    </form>

</body>
</html>
